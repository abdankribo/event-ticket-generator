<!doctype html><html lang="id"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Passly Ticket Generator</title><link rel="stylesheet" href="style.css"></head><body><main><nav><img src="assets/logo.svg"><b>PASSLY</b><span>EVENT TICKETING SYSTEM</span></nav><div class="layout"><section class="form"><small>CREATE PASS</small><h1>Generate event ticket.</h1><p>Ticket digital dengan ID unik dan sistem verifikasi.</p><label>Event<input id="event" value="NIGHT OF IDEAS"></label><label>Participant<input id="person" value="Abdan Syakura"></label><label>Email<input id="email" value="abdan@example.com"></label><label>Type<select id="type"><option>Regular — Rp150.000</option><option>VIP — Rp350.000</option><option>Early Bird — Rp100.000</option></select></label><label>Date<input id="date" type="date" value="2026-09-20"></label><button id="generate">Generate ticket</button><button id="verify" class="ghost">Verify ticket</button></section><section><div class="ticket"><div class="top"><div><small>PASSLY PRESENTS</small><h2 id="tevent">NIGHT OF IDEAS</h2><p id="tdate">2026-09-20 • 19:00</p></div><b>VIP</b></div><div class="mid"><div><small>ATTENDEE</small><h3 id="tperson">Abdan Syakura</h3><small>EMAIL</small><p id="temail">abdan@example.com</p></div><img src="assets/qr.svg"></div><footer><span id="tid">PASS-000000</span><span id="ttype">REGULAR</span><button id="print">Print</button></footer></div><div class="history"><header><h2>Recent tickets</h2><button id="clear">Clear</button></header><div id="history"></div></div></section></div></main><dialog id="dlg"><form id="vf"><h2>Verify Ticket</h2><input id="vid" placeholder="PASS-123456" required><button>Verify</button><p id="result"></p></form></dialog><script src="script.js"></script></body></html>
